{{ define "main" }}
<div class="universal-wrapper">
  <!-- 배너 이미지 출력 -->
  {{ with .Params.banner }}
  <div class="page-banner">
    <img src="/{{ .image }}" alt="배너 이미지">
    {{ if .caption }}
    <p class="banner-caption">{{ .caption | safeHTML }}</p>
    {{ end }}
  </div>
  {{ end }}
  
  <h1>{{ .Title }}</h1>
  <p>{{ .Content }}</p>
  
  <div class="award-grid">
    {{ range .Pages }}
    <article class="award-card">
      {{ if .Params.image }}
      <a href="{{ .RelPermalink }}">
        <img src="{{ .Params.image.url | default "awacer.jpg" }}" alt="{{ .Title }}">
      </a>
      {{ end }}
      
      <h2>
        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      </h2>
      
      <div class="award-meta">
        <span>{{ .Date.Format "2006년 1월 2일" }}</span>
      </div>
      
      <p>{{ .Summary }}</p>
      
      <a href="{{ .RelPermalink }}" class="btn btn-primary">자세히 보기 →</a>
    </article>
    {{ end }}
  </div>
</div>
{{ end }}
