# SITE SETUP
# Guide: https://docs.hugoblox.com/tutorial/
# Documentation: https://docs.hugoblox.com/
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/

# Appearance

appearance:
  theme_day: sky
  theme_night: dark
  font: sky
  font_size: L
  color: sky

# SEO

marketing:
  seo:
    site_type: Person
    local_business_type: ''
    org_name: '최연재'
    description: '전북대학교 최연재 | 포트폴리오'
    twitter: ''
    keywords: ["최연재", "연재", "CHOI SEOYEON", '전북대','JBNU', "MACS", "CSE", "Medical AI", "컴퓨터공학", "전북대학교", "ALPS"]
    open_graph:
      title: '전북대학교 최연재 | 포트폴리오'
      image: 'https://dllxxun.github.io/assets/media/icon.png'
  analytics:
    google_analytics: ''
    baidu_tongji: ''
    google_tag_manager: ''
    microsoft_clarity: ''
  verification:
    google: 'boZImsDodWvlGbpQDArriO5q0QNV6kHAYNV2FtoDPpo'
    baidu: ''

# Site header

header:
  navbar:
    enable: true
    align: r
    show_logo: true
    show_language: false
    show_day_night: true
    show_search: true
    highlight_active_link: false
    logo:
      text: ""  
      filename: "assets/media/icon.png"  
      # Ensure the file exists in `assets/media/`

# Site footer

footer:
  copyright:
    notice: '© {year} Me. This work is licensed under {license}'
    license:
      enable: true
      allow_derivatives: false
      share_alike: true
      allow_commercial: false

# Localization

locale:
  date_format: 'Jan 2, 2006'
  time_format: '3:04 PM'
  address_format: en-us

# Site features

features:
  syntax_highlighter:
    enable: false
    extra_languages:
      - r
      - latex
  math:
    enable: false
  privacy_pack:
    enable: false
  repository:
    url: 'https://github.com/dllxxun/dllxxun.github.io'
    content_dir: content
    branch: main
  avatar:
    gravatar: false
    shape: circle
  comment:
    provider: ''
    disqus:
      shortname: ''
      show_count: true
    commento:
      url: ''
    giscus:
      repo: ''
      repo_id: ''
      category: ''
      category_id: ''
  search:
    provider: wowchemy
    algolia:
      app_id: ''
      api_key: ''
      index_name: ''
      show_logo: false
  map:
    provider: 'mapnik'
    api_key: ''
    zoom: 15

# Extensions

extensions:
  decap_cms:
    branch: main
    local_backend: false
  academicons:
    enable: true

# Citation style

publications:
  date_format: January 2006
  citation_style: apa
